[project]
name = "metascalp-orderbook-mvp"
version = "0.1.0"
description = "MVP crypto order book analytics platform using MetaScalp and ClickHouse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "websockets>=12.0",
  "clickhouse-connect>=0.7.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
